[package]
name = "joyshockrust-ipc"
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true

[features]
server = ["dep:nix"]

[dependencies]
joyshockrust-config = { path = "../joyshockrust-config", features = ["controller"] }
joyshockrust-core = { path = "../joyshockrust-core" }

[target.'cfg(target_os = "linux")'.dependencies]
libc = "0.2"
nix = { version = "0.29", features = ["poll", "socket", "user"], optional = true }

[target.'cfg(target_os = "linux")'.dev-dependencies]
tempfile = "3"

[lints]
workspace = true
