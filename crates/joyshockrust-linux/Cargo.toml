[package]
name = "joyshockrust-linux"
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true

[target.'cfg(target_os = "linux")'.dependencies]
joyshockrust-ipc = { path = "../joyshockrust-ipc" }
joyshockrust-config = { path = "../joyshockrust-config", features = ["profile"] }
evdev.workspace = true
nix = { version = "0.29", features = ["ioctl", "poll", "resource", "signal"] }
udev = "0.9.3"
serde = { version = "1", features = ["derive"] }
toml = "0.9"
toml_edit.workspace = true
joyshockrust-core = { path = "../joyshockrust-core" }
joyshockrust-input = { path = "../joyshockrust-input" }
joyshockrust-motion = { path = "../joyshockrust-motion" }
joyshockrust-mapping = { path = "../joyshockrust-mapping", features = ["profile"] }

[target.'cfg(target_os = "linux")'.dev-dependencies]
allocation-counter = "0.8.1"

[lints.rust]
unsafe_code = "deny"
