name: Rust

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - run: rustup toolchain install stable --profile minimal --component rustfmt --component clippy
      - run: >-
          sudo apt-get update &&
          sudo apt-get install --yes libudev-dev pkg-config libgtk-4-dev
          libadwaita-1-dev dbus-daemon weston
      - run: cargo +stable fmt --all --check
      - run: cargo +stable fetch --locked
      - run: cargo +stable clippy --locked --offline --workspace --all-targets -- -D warnings
      - run: cargo +stable test --locked --offline --workspace
      - name: Test the editor on headless Wayland
        timeout-minutes: 5
        env:
          RUSTUP_TOOLCHAIN: stable
        run: scripts/test-editor-wayland.sh
